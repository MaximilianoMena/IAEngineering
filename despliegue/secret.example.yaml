# Template de Secret — NO subir con valores reales al repo.
# Generar el real con:
#   kubectl create secret generic mercado-ar-rag-secrets \
#     --from-literal=GROQ_API_KEY=tu_clave_real
apiVersion: v1
kind: Secret
metadata:
  name: mercado-ar-rag-secrets
type: Opaque
stringData:
  GROQ_API_KEY: "reemplazar-en-runtime-o-via-kubectl-create-secret"
